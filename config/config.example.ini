# Copie para config.ini e configure localmente. Nunca publique config.ini.
# Variáveis DB_ORIGEM_*, DB_DESTINO_* e SMTP_* têm prioridade.
[origem]
driver = ODBC Driver 17 for SQL Server
server = SERVIDOR_ORIGEM
port = 1433
database = BANCO_ORIGEM
username = USUARIO_ORIGEM
password =
schema = dbo

[destino]
driver = ODBC Driver 17 for SQL Server
server = SERVIDOR_DESTINO
port = 1433
database = BANCO_DESTINO
username = USUARIO_DESTINO
password =
schema = dbo

[configuracao]
timeout_conexao = 30
timeout_query = 0
batch_size = 5000
max_workers = 4
log_dir = logs
dias_retencao_logs = 14
dias_retry_attempts = 3
port = 5050
lock_timeout_ms = 5000
limite_linhas_tabela_grande = 150000
max_recargas_grandes_simultaneas = 2
limite_seguranca_exclusoes_pct = 0.05

[email]
servidor_smtp = smtp.example.com
porta_smtp = 587
usuario =
senha =
remetente =
destinatarios =

[tabelas]
# Sem tabelas ativas por padrão. Configure pelo painel ou informe aqui.
# Exemplo de formato: SA1010,SB1010 (confira os nomes do seu ambiente).
tabelas_diff =
tabelas_completo =
